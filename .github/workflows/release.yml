name: Release (Windows)

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate release version
        shell: bash
        run: node scripts/release-metadata.mjs "$RELEASE_TAG"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --ci --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-release.conf.json

      - name: Validate and stage release assets
        shell: bash
        run: node scripts/release-metadata.mjs "$RELEASE_TAG" src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis release-assets

      - name: Upload and verify draft before publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite $TAG"
            exit 1
          fi
          gh release create "$TAG" --verify-tag --draft --title "ADB WiFi Installer $TAG" --notes-file "docs/releases/$TAG.md"
          gh release upload "$TAG" release-assets/*
          gh release download "$TAG" --dir release-verification
          for asset in release-assets/*; do
            cmp "$asset" "release-verification/$(basename "$asset")"
          done
          gh release edit "$TAG" --draft=false --latest
